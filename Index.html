<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>imagenapdf</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        :root {
            --ig-bg: #ffffff;
            --ig-primary: #0095f6;
            --ig-text: #262626;
            --ig-border: #dbdbdb;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }

        body { background-color: #fafafa; color: var(--ig-text); display: flex; justify-content: center; min-height: 100vh; }

        .app-container { width: 100%; max-width: 400px; background: var(--ig-bg); min-height: 100vh; display: flex; flex-direction: column; border-left: 1px solid var(--ig-border); border-right: 1px solid var(--ig-border); }

        /* Estilo Login */
        .login-box { padding: 40px; display: flex; flex-direction: column; justify-content: center; height: 100vh; }
        .login-box h1 { margin-bottom: 30px; font-weight: 700; text-align: center; font-size: 2rem; letter-spacing: -1px; }
        
        input { width: 100%; padding: 12px; margin-bottom: 10px; border: 1px solid var(--ig-border); border-radius: 5px; background: #fafafa; }
        
        /* Estilo App */
        header { padding: 15px; border-bottom: 1px solid var(--ig-border); text-align: center; font-weight: bold; font-size: 1.2rem; }
        .main-content { flex: 1; padding: 20px; }
        
        .upload-btn { background: var(--ig-primary); color: white; padding: 12px; border-radius: 8px; text-align: center; font-weight: 600; cursor: pointer; display: block; }
        
        #preview-container { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 20px; }
        .preview-img { width: 100%; height: 110px; object-fit: cover; border-radius: 4px; }

        .bottom-actions { padding: 20px; border-top: 1px solid var(--ig-border); }
        .btn-action { width: 100%; padding: 12px; border-radius: 8px; border: none; font-weight: 600; cursor: pointer; margin-bottom: 10px; }
        .btn-pdf { background: #0095f6; color: white; }
        .btn-share { background: #34c759; color: white; }
        
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- LOGIN -->
        <div id="login-screen" class="login-box">
            <h1>imagenapdf</h1>
            <input type="text" id="username" placeholder="Usuario">
            <input type="password" placeholder="Contraseña">
            <button class="btn-action btn-pdf" onclick="handleLogin()">Entrar</button>
        </div>

        <!-- APP -->
        <div id="app-screen" class="screen hidden">
            <header>imagenapdf</header>
            <div class="main-content">
                <label class="upload-btn">
                    Seleccionar imágenes
                    <input type="file" id="file-input" accept="image/*" multiple class="hidden" onchange="previewImages(event)">
                </label>
                <div id="preview-container"></div>
            </div>
            
            <div class="bottom-actions">
                <button id="btn-generate" class="btn-action btn-pdf hidden" onclick="generatePDF()">Generar PDF</button>
                <button id="btn-share" class="btn-action btn-share hidden" onclick="sharePDF()">Compartir</button>
            </div>
        </div>
    </div>

    <script>
        const { jsPDF } = window.jspdf;
        let selectedFiles = [];
        let currentPdfBlob = null;

        function handleLogin() {
            const user = document.getElementById('username').value;
            if(user) {
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('app-screen').classList.remove('hidden');
            }
        }

        function previewImages(event) {
            const container = document.getElementById('preview-container');
            const files = event.target.files;
            for(let file of files) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    selectedFiles.push(e.target.result);
                    const img = document.createElement('img');
                    img.src = e.target.result;
                    img.className = 'preview-img';
                    container.appendChild(img);
                };
                reader.readAsDataURL(file);
            }
            document.getElementById('btn-generate').classList.remove('hidden');
        }

        async function generatePDF() {
            const doc = new jsPDF();
            selectedFiles.forEach((img, i) => {
                if(i > 0) doc.addPage();
                doc.addImage(img, 'JPEG', 10, 10, 190, 277);
            });
            currentPdfBlob = doc.output('blob');
            document.getElementById('btn-share').classList.remove('hidden');
            alert("¡PDF listo para compartir!");
        }

        async function sharePDF() {
            const file = new File([currentPdfBlob], "Documento.pdf", { type: "application/pdf" });
            if (navigator.share) {
                await navigator.share({ files: [file] });
            } else {
                const a = document.createElement('a');
                a.href = URL.createObjectURL(currentPdfBlob);
                a.download = "documento.pdf";
                a.click();
            }
        }
    </script>
</body>
</html>
